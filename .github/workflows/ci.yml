name: CI

on:
  push:
  pull_request:

jobs:
  validate-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose.yaml
        run: |
          cp .env.example .env
          PELICAN_ROOT=$(pwd) docker compose --env-file .env -f docker-compose.yaml config -q
